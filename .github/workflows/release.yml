name: Release

# Builds release binaries and attaches them to a GitHub Release when a version
# tag (v*) is pushed. Also runnable manually to smoke-test the build matrix.
#
# Windows is intentionally absent: the server controls Hatari through a Unix
# FIFO (std::os::unix::fs::FileTypeExt), so it does not compile on Windows
# without a named-pipe port. Tracked as a follow-up issue.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: shiraz-mcp-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: shiraz-mcp-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            name: shiraz-mcp-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: tar -czf ${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release shiraz-mcp

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
